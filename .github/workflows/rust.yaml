name: Rust CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        if: runner.os == 'Windows'
        run: cargo test --verbose

      - name: Install fuse3 on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev

      - name: Install macFUSE on macOS
        if: runner.os == 'macOS'
        run: brew install --cask macfuse

      - name: Run tests with FUSE
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cargo test --verbose -F fuse


  test-freebsd:
    name: Test on FreeBSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Cache cargo dependencies on FreeBSD
        uses: actions/cache@v4
        id: cargo-cache-freebsd
        with:
          path: .cargo-cache
          key: freebsd-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests on FreeBSD
        uses: cross-platform-actions/action@v0.30.0
        with:
          operating_system: freebsd
          version: "13.3"
          shell: "bash"
          run: |
            sudo pkg install -y rust fusefs-libs3  ninja pkgconf cmake
            sudo kldload fusefs || true
            export CARGO_HOME=.cargo-cache
            cargo test --verbose -F fuse
