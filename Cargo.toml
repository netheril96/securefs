[package]
name = "securefs"
version = "3.0.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["aes", "alloc", "std"], default-features = false }
aes-siv = { version = "0.7.0", default-features = false, features = ["alloc", "std"] }
ahash = "0.8.12"
ambassador = "0.4.2"
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["std"] }
blake2 = "0.10.6"
const-hex = "1.17.0"
ctr = { version = "0.9.2", default-features = false, features = ["alloc", "std"] }
fast32 = "1.0.3"
ghash = { version = "0.5.1", default-features = false, features = ["std"] }
hmac = { version = "0.12.1", features = ["std"] }
libc = "0.2.177"
log = "0.4.28"
lru = "0.16.2"
num-bigint = "0.4.6"
once_cell = { version = "1.21.3", features = ["parking_lot"] }
parking_lot = "0.12.5"
pbkdf2 = { version = "0.12.2", features = ["sha2", "std"] }
protobuf = "3.7.2"
protobuf-json-mapping = "3.7.2"
rand = "0.9.2"
rand_chacha = { version = "0.9.0", features = ["os_rng"] }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
scopeguard = "1.2.0"
scrypt = { version = "0.11.0", features = ["std"] }
sha2 = { version = "0.10.9", features = ["asm", "asm-aarch64", "std"] }
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
thread_local = "1.1.9"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["once_cell", "parking_lot", "env-filter"] }

[features]
fuse = [ "dep:bindgen", "dep:pkg-config"]

[dev-dependencies]
tempfile = "3.23.0"
rstest = "0.26.1"
subcase = "0.4.0"

[build-dependencies]
protobuf-codegen = "3.7.2"

[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1.1.2", features = ["fs", "stdio", "termios"] }

[target.'cfg(not(windows))'.build-dependencies]
bindgen = { version = "0.72.1", optional = true }
pkg-config = { version = "0.3.32", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Console", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_IO", "Wdk_Storage_FileSystem_Minifilters", "Wdk_System_SystemServices", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading"] }
winfsp = "0.12.4"
winfsp-sys = "0.12.1"

[target.'cfg(windows)'.build-dependencies]
winfsp = "0.12.4"
