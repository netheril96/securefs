[package]
name = "securefs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["aes", "alloc", "std"], default-features = false }
aes-siv = { version = "0.7.0", default-features = false, features = ["alloc", "std"] }
anyhow = "1.0.100"
blake2 = "0.10.6"
ctr = { version = "0.9.2", default-features = false, features = ["alloc", "std"] }
fast32 = "1.0.3"
fuser = { version = "0.16.0", optional = true, features = ["libfuse"] }
ghash = { version = "0.5.1", default-features = false, features = ["std"] }
libc = "0.2.177"
log = "0.4.28"
lru = "0.16.2"
once_cell = { version = "1.21.3", features = ["parking_lot"] }
parking_lot = "0.12.5"
rand = "0.9.2"
rusqlite = "0.37.0"
rustix = { version = "1.1.2", features = ["fs", "stdio", "termios"] }
subtle = "2.6.1"
thiserror = "2.0.17"
thread_local = "1.1.9"

[features]
fuse = ["dep:fuser"]

[build-dependencies]
cc = "1.2.48"

[dev-dependencies]
tempfile = "3.23.0"
rstest = "0.26.1"
subcase = "0.4.0"
